<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KSK-appen</title>
    <meta name="description" content="Ett komplett verktyg för fotbollscoachen. Planera träningspass med tävlingsmoment och poängräkning. Hantera spelartrupp med bilder, bygg laguppställningar och håll koll på poängjakt och statistik." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KSK-appen" />
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;margin:24px auto;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;color:#9f1239;max-width:600px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);"><h2 style="margin:0 0 12px 0;font-size:18px;">Ett fel inträffade vid start</h2><div style="background:#fff;padding:12px;border-radius:6px;border:1px solid #ffe4e6;font-family:monospace;font-size:13px;word-break:break-all;white-space:pre-wrap;margin-bottom:12px;">' + (e.message || e.error || e) + (e.filename ? ('\n' + e.filename + (e.lineno ? (':' + e.lineno) : '')) : '') + '</div><p style="margin:0;font-size:12px;color:#64748b;">Tips: Öppna konsolen (Cmd + Option + J på Mac) för att se mer information.</p></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  <meta name="application-name" content="KSK-appen" /></head>
  <body>
    <div id="root"></div>
  </body>
</html>
